name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Ansible collections for linting
        run: |
          pip install ansible-core --quiet
          ansible-galaxy collection install ansible.posix community.general -p collections

      - name: Run super-linter
        uses: super-linter/super-linter@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_YAML: true
          VALIDATE_ANSIBLE: true
          VALIDATE_MARKDOWN: true
          ANSIBLE_DIRECTORY: .
          DEFAULT_BRANCH: main
          ANSIBLE_COLLECTIONS_PATH: /github/workspace/collections
