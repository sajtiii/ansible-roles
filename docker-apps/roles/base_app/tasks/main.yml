- name: Install & Configure compose application {{ name | title }}
  when: enabled
  block:
    - name: Make sure application directory /srv/{{ name }} exists
      ansible.builtin.file:
        path: "/srv/{{ name }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Copy compose file for application {{ name | title }}
      ansible.builtin.template:
        src: "docker-compose.yml.j2"
        dest: "/srv/{{ name }}/docker-compose.yml"
        mode: "0644"
      notify: "Update docker-app-{{ service_name }}"
- name: Stop compose application {{ service_name | title }}
  when: not enabled
  block:
    - name: Stop Docker Compose application {{ service_name | title }}
      ansible.builtin.command:
        cmd: docker compose -f /srv/{{ service_name }}/docker-compose.yml down
      changed_when: false
      failed_when: false
    - name: Remove application directory /srv/{{ service_name }}
      when: cleanup | default(false)
      ansible.builtin.file:
        path: "/srv/{{ service_name }}"
        state: absent
