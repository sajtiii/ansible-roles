---
dependency:
  name: galaxy
  options:
    requirements-file: "../../../../molecule-requirements.yml"
driver:
  name: docker
platforms:
  - name: instance
    image: geerlingguy/docker-debian12-ansible:latest
    command: /lib/systemd/systemd
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
verifier:
  name: ansible
