- name: Ensure docker group exists with gid 899
  ansible.builtin.group:
    name: docker
    gid: 899
    state: present
- name: Make sure /etc/apt/keyrings folder exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
- name: Add Docker GPG apt Key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/debian/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
- name: Get DEB architecture
  ansible.builtin.shell: dpkg --print-architecture
  register: deb_architecture
  changed_when: false
- name: Add Docker Repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch={{ deb_architecture.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
- name: Ensure Docker is installed
  ansible.builtin.package:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: latest
- name: Copy daemon.json configuration
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: 0644
  notify: restart docker
- name: Add dx command (docker exec)
  ansible.builtin.copy:
    src: dx
    dest: /usr/local/bin/dx
    mode: "0755"
- name: Make sure /etc/bash_completion.d folder exists
  ansible.builtin.file:
    path: /etc/bash_completion.d
    state: directory
    mode: "0755"
- name: Add bash completion for dx command
  ansible.builtin.copy:
    src: dx-completion.bash
    dest: /etc/bash_completion.d/dx-completion.bash
    mode: "0644"
- name: Copy docker compose service to systemd
  ansible.builtin.copy:
    src: docker-compose@.service
    dest: /etc/systemd/system/docker-compose@.service
    mode: "0644"
  notify: reload systemd
- name: Create /etc/docker-compose folder
  ansible.builtin.file:
    path: /etc/docker-compose
    state: directory
    mode: "0755"
- name: Enable docker service and start docker
  ansible.builtin.service:
    enabled: true
    name: docker
    state: started
