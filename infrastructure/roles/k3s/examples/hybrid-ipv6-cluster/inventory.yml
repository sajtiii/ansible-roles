---
# Example inventory for hybrid IPv6 k3s cluster on Hetzner
# Architecture:
# - 2 IPv6-only nodes: internal cluster communication only
# - 2 Dual-stack nodes (IPv4+IPv6): serve as IPv4 entrypoints for external access
#
# All nodes communicate internally via IPv6 over WireGuard
# Control plane is accessible via IPv4
# Pods/services use dual-stack (IPv6 internally, accessible via IPv4 through dual-stack nodes)

all:
  children:
    k3s_cluster:
      children:
        k3s_servers:
          hosts:
            # Server 1: Dual-stack node (IPv4 entrypoint)
            server1.example.com:
              ansible_host: 203.0.113.1  # Public IPv4
              ipv4_address: 203.0.113.1
              ipv6_address: "2a01:4f8:1234:5678::1"  # Public IPv6
              k3s:
                role: both
                cluster_init: true

            # Server 2: IPv6-only node
            server2.example.com:
              ansible_host: "2a01:4f8:1234:5679::1"  # Public IPv6 only
              ipv6_address: "2a01:4f8:1234:5679::1"
              k3s:
                role: both
                cluster_init: false

        k3s_agents:
          hosts:
            # Agent 1: Dual-stack node (IPv4 entrypoint)
            agent1.example.com:
              ansible_host: 203.0.113.2  # Public IPv4
              ipv4_address: 203.0.113.2
              ipv6_address: "2a01:4f8:1234:5680::1"  # Public IPv6
              k3s:
                role: agent

            # Agent 2: IPv6-only node
            agent2.example.com:
              ansible_host: "2a01:4f8:1234:5681::1"  # Public IPv6 only
              ipv6_address: "2a01:4f8:1234:5681::1"
              k3s:
                role: agent

      vars:
        # Cluster-wide k3s configuration
        k3s:
          # Cluster token (generate with: openssl rand -base64 32)
          token: "YOUR_SECURE_TOKEN_HERE"

          # Server URL for agents and additional servers to join
          # Use IPv4 address of the first server for control plane access
          server: "https://203.0.113.1:6443"

          # WireGuard native backend for IPv6 node-to-node communication
          wireguard:
            enabled: true

          # Dual-stack IPv6 configuration
          # Note: IPv6 must be first because nodes have IPv6 as primary address
          ipv6:
            enabled: true
            dual_stack: true
            cluster_cidr: "fd00:42::/56,10.42.0.0/16"
            service_cidr: "fd00:43::/112,10.43.0.0/16"
            node_cidr_mask_size_ipv4: 24
            node_cidr_mask_size_ipv6: 64
            masquerade: true

          # API server configuration (IPv4 for external access)
          api_server:
            # Don't set bind_address - let k3s bind to all interfaces (including loopback)
            advertise_address: "203.0.113.1"

          # Traefik and metrics disabled (handled externally)
          traefik:
            enabled: false
          metrics:
            enabled: false
