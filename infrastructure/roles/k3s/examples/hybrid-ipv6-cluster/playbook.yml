---
# Example playbook for deploying hybrid IPv6 k3s cluster
# Usage: ansible-playbook -i inventory.yml playbook.yml

- name: Deploy k3s hybrid IPv6 cluster
  hosts: k3s_cluster
  become: true

  pre_tasks:
    - name: Ensure IPv6 is enabled
      ansible.builtin.sysctl:
        name: net.ipv6.conf.all.disable_ipv6
        value: "0"
        state: present
        reload: true

    - name: Ensure IPv6 forwarding is enabled
      ansible.builtin.sysctl:
        name: net.ipv6.conf.all.forwarding
        value: "1"
        state: present
        reload: true

    - name: Install WireGuard kernel module (if needed)
      ansible.builtin.package:
        name: wireguard
        state: present
      when: ansible_distribution == "Debian" or ansible_distribution == "Ubuntu"

  roles:
    - role: k3s

  post_tasks:
    - name: Wait for k3s to be ready
      ansible.builtin.wait_for:
        port: 6443
        delay: 5
        timeout: 300
      when: k3s.role in ['both', 'control-plane']

    - name: Fetch kubeconfig (from first server only)
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/kubeconfig"
        flat: true
      when:
        - k3s.role in ['both', 'control-plane']
        - inventory_hostname == groups['k3s_servers'][0]

- name: Verify cluster
  hosts: k3s_servers[0]
  become: true
  gather_facts: false

  tasks:
    - name: Check cluster nodes
      ansible.builtin.command: kubectl get nodes -o wide
      register: nodes_output
      changed_when: false

    - name: Display cluster nodes
      ansible.builtin.debug:
        var: nodes_output.stdout_lines

    - name: Check pod networking
      ansible.builtin.command: kubectl get pods -A -o wide
      register: pods_output
      changed_when: false

    - name: Display cluster pods
      ansible.builtin.debug:
        var: pods_output.stdout_lines
