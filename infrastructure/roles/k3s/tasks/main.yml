- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
- name: Template k3s configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: restart k3s
- name: Check if k3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: __k3s_is_installed
- name: Install k3s
  when: not __k3s_is_installed.stat.exists
  block:
    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"
    - name: Run k3s install script (server)
      ansible.builtin.command: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_SKIP_START: "true"
      when: k3s.role in ['both', 'etcd', 'control-plane']
    - name: Run k3s install script (agent)
      ansible.builtin.command: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_EXEC: agent
        INSTALL_K3S_SKIP_START: "true"
      when: k3s.role == 'agent'
    - name: Remove install script
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent
- name: Enable and start k3s service
  ansible.builtin.service:
    name: "{{ 'k3s-agent' if k3s.role == 'agent' else 'k3s' }}"
    enabled: true
    state: started
- name: Configure CoreDNS to respect node hosts file
  when:
    - k3s.role != 'agent'
    - k3s.dns.pass_hosts_file
  block:
    - name: Wait for CoreDNS deployment to be available
      ansible.builtin.command: >-
        k3s kubectl wait --namespace kube-system
        --for=condition=available deployment/coredns
        --timeout=300s
      changed_when: false

    - name: Get current CoreDNS Corefile
      ansible.builtin.command: >-
        k3s kubectl get configmap coredns -n kube-system
        -o jsonpath={.data.Corefile}
      register: __coredns_corefile
      changed_when: false

    - name: Patch CoreDNS ConfigMap to add hosts plugin
      when: "'hosts /etc/coredns/node-hosts' not in __coredns_corefile.stdout"
      ansible.builtin.shell: |
        k3s kubectl get configmap coredns -n kube-system -o json | python3 -c "
        import json, sys
        cm = json.load(sys.stdin)
        hosts_block = '    hosts /etc/coredns/node-hosts {\n        reload 15s\n        fallthrough\n    }\n'
        cm['data']['Corefile'] = cm['data']['Corefile'].replace(
            '    prometheus', hosts_block + '    prometheus', 1
        )
        print(json.dumps(cm))
        " | k3s kubectl apply -f -

    - name: Check if CoreDNS deployment already has node-hosts-file volume
      ansible.builtin.command: >-
        k3s kubectl get deployment coredns -n kube-system
        -o jsonpath={.spec.template.spec.volumes[?(@.name=="node-hosts-file")].name}
      register: __coredns_hosts_volume
      changed_when: false

    - name: Patch CoreDNS Deployment to mount node hosts file
      when: __coredns_hosts_volume.stdout == ''
      ansible.builtin.shell: |
        k3s kubectl patch deployment coredns -n kube-system --type=json -p='[
          {"op":"add","path":"/spec/template/spec/volumes/-","value":{"name":"node-hosts-file","hostPath":{"path":"/etc/hosts","type":"File"}}},
          {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-","value":{"name":"node-hosts-file","mountPath":"/etc/coredns/node-hosts","readOnly":true}}
        ]'

    - name: Restart CoreDNS to apply changes
      when: >-
        'hosts /etc/coredns/node-hosts' not in __coredns_corefile.stdout or
        __coredns_hosts_volume.stdout == ''
      ansible.builtin.command: >-
        k3s kubectl rollout restart deployment/coredns -n kube-system
