- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
- name: Template k3s configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: restart k3s
- name: Check if k3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: __k3s_is_installed
- name: Install k3s
  when: not __k3s_is_installed.stat.exists
  block:
    - name: Download k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"
    - name: Run k3s install script (server)
      ansible.builtin.command: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_SKIP_START: "true"
      when: k3s.role in ['both', 'etcd', 'control-plane']
    - name: Run k3s install script (agent)
      ansible.builtin.command: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_EXEC: agent
        INSTALL_K3S_SKIP_START: "true"
      when: k3s.role == 'agent'
    - name: Remove install script
      ansible.builtin.file:
        path: /tmp/k3s-install.sh
        state: absent
- name: Enable and start k3s service
  ansible.builtin.service:
    name: "{{ 'k3s-agent' if k3s.role == 'agent' else 'k3s' }}"
    enabled: true
    state: started
- name: Configure CoreDNS to respect node hosts file
  when:
    - k3s.role != 'agent'
    - k3s.dns.pass_hosts_file
  block:
    - name: Get current CoreDNS Corefile
      ansible.builtin.command: >-
        k3s kubectl get configmap coredns -n kube-system
        -o jsonpath={.data.Corefile}
      register: __coredns_corefile
      changed_when: false

    # k3s CoreDNS already has a `hosts /etc/coredns/NodeHosts` block managed by k3s.
    # CoreDNS does not allow duplicate plugins in a server block, so we must not add
    # another `hosts` entry. Instead we shadow the NodeHosts path with a hostPath mount.
    # This task removes any previously added duplicate block.
    - name: Remove incorrectly added duplicate hosts block from CoreDNS Corefile
      when: "'hosts /etc/coredns/node-hosts' in __coredns_corefile.stdout"
      ansible.builtin.shell: |
        k3s kubectl get configmap coredns -n kube-system -o json | python3 -c "
        import json, sys
        cm = json.load(sys.stdin)
        hosts_block = '    hosts /etc/coredns/node-hosts {\n        reload 15s\n        fallthrough\n    }\n'
        cm['data']['Corefile'] = cm['data']['Corefile'].replace(hosts_block, '', 1)
        print(json.dumps(cm))
        " | k3s kubectl apply -f -

    - name: Check if CoreDNS deployment has node-hosts-file mounted at NodeHosts path
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - deployment
          - coredns
          - -n
          - kube-system
          - -o
          - "jsonpath={.spec.template.spec.containers[0].volumeMounts[?(@.mountPath=='/etc/coredns/NodeHosts')].name}"
      register: __coredns_hosts_mount
      changed_when: false

    - name: Patch CoreDNS Deployment to overlay NodeHosts with node hosts file
      when: __coredns_hosts_mount.stdout != 'node-hosts-file'
      ansible.builtin.shell: |
        k3s kubectl get deployment coredns -n kube-system -o json | python3 -c "
        import json, sys
        deploy = json.load(sys.stdin)
        spec = deploy['spec']['template']['spec']
        spec['volumes'] = [v for v in spec['volumes'] if v['name'] != 'node-hosts-file']
        for c in spec['containers']:
            c['volumeMounts'] = [m for m in c['volumeMounts'] if m['name'] != 'node-hosts-file']
        spec['volumes'].append({
            'name': 'node-hosts-file',
            'hostPath': {'path': '/etc/hosts', 'type': 'File'}
        })
        for c in spec['containers']:
            if c['name'] == 'coredns':
                c['volumeMounts'].append({
                    'name': 'node-hosts-file',
                    'mountPath': '/etc/coredns/NodeHosts',
                    'readOnly': True
                })
        print(json.dumps(deploy))
        " | k3s kubectl apply -f -

    - name: Restart CoreDNS to apply changes
      when: >-
        'hosts /etc/coredns/node-hosts' in __coredns_corefile.stdout or
        __coredns_hosts_mount.stdout != 'node-hosts-file'
      ansible.builtin.command: >-
        k3s kubectl rollout restart deployment/coredns -n kube-system
