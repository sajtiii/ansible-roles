- name: Install tailscale (Debian)
  when:
    - tailscale.install
    - ansible_os_family == "Debian"
  block:
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Add Tailscale apt signing key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"
      check_mode: false
    - name: Add Tailscale apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/tailscale.list
        content: >-
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
          https://pkgs.tailscale.com/stable/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} main
        owner: root
        group: root
        mode: "0644"
    - name: Install tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: latest
        update_cache: true
- name: Install tailscale (openSUSE MicroOS)
  ansible.builtin.command:
    cmd: transactional-update --non-interactive pkg install tailscale
  register: _ts_tu_result
  changed_when: "'Nothing to do' not in _ts_tu_result.stdout"
  when:
    - tailscale.install
    - ansible_distribution == "openSUSE MicroOS"
- name: Configure IP forwarding for exit node or subnet routes
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tailscale.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the sajtii.networking tailscale role. Local changes will be overwritten.
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
  when: tailscale.exit_node or (tailscale.advertise_routes | length > 0)
  notify: Reload sysctl
- name: Remove IP forwarding config when not needed
  ansible.builtin.file:
    path: /etc/sysctl.d/99-tailscale.conf
    state: absent
  when: not tailscale.exit_node and (tailscale.advertise_routes | length == 0)
- name: Flush handlers so forwarding is active before tailscale up
  ansible.builtin.meta: flush_handlers
- name: Enable and start tailscaled
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started
- name: Read current tailscale backend state
  ansible.builtin.command:
    cmd: tailscale status --json
  register: _ts_status_raw
  changed_when: false
  failed_when: false
  check_mode: false
- name: Derive tailscale login state
  ansible.builtin.set_fact:
    _ts_logged_in: "{{ ((_ts_status_raw.stdout | default('{}')) | from_json).BackendState | default('') == 'Running' }}"
- name: Skip login because tailscale is logged out and no auth key was provided
  ansible.builtin.debug:
    msg: "tailscale is logged out and tailscale.auth_key is empty; skipping tailscale up"
  when:
    - not _ts_logged_in
    - not (tailscale.auth_key | bool)
- name: Log in to tailscale
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--login-server={{ tailscale.login_url }}"
      - "--auth-key={{ tailscale.auth_key }}"
  when:
    - not _ts_logged_in
    - tailscale.auth_key | bool
  no_log: true
  changed_when: true
- name: Re-read tailscale backend state after login
  ansible.builtin.command:
    cmd: tailscale status --json
  register: _ts_status_raw
  changed_when: false
  failed_when: false
  check_mode: false
- name: Re-derive tailscale login state after login
  ansible.builtin.set_fact:
    _ts_logged_in: "{{ ((_ts_status_raw.stdout | default('{}')) | from_json).BackendState | default('') == 'Running' }}"
- name: Configure exit-node advertisement
  ansible.builtin.include_tasks: _tailscale_set.yml
  vars:
    key: advertise-exit-node
    value: "{{ tailscale.exit_node | bool | lower }}"
- name: Configure advertised routes
  ansible.builtin.include_tasks: _tailscale_set.yml
  vars:
    key: advertise-routes
    value: "{{ tailscale.advertise_routes | join(',') }}"
