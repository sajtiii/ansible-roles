wireguard:
  install: true
  interfaces: {}
  # Example interface configuration:
  # interfaces:
  #   wg-servers:
  #     port: 51820
  #     ipv4:
  #       cidr: "10.10.0.0/24"
  #       auto_assign:
  #         enabled: true
  #         pool_start: "10.10.0.200"
  #         pool_end: "10.10.0.254"
  #     ipv6:  # optional; omit to disable IPv6
  #       cidr: "fd00:10:10:0::/64"
  #     topology: mesh  # mesh | hub-spoke
  #     keepalive: 25
  #     # preshared_key: ""  # optional, shared across all peers
  #     nodes:
  #       myhost:
  #         private_key: ""  # must be provided, not generated by ansible
  #         public_key: ""
  #         ipv4: "" # optional
  #         notify:
  #           print: true  # print this node's peer info to Ansible output
  #         post_up: []  # optional list of PostUp commands (wg-quick hook)
  #         pre_down: []  # optional list of PreDown commands (wg-quick hook)
  #         additional_hosts: []  # extra hostname aliases for this node (same WireGuard IP)
