---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    users:
      - username: testuser
        password: "{{ 'testpass' | password_hash('sha512') }}"
        shell: /bin/bash
        groups:
          - sudo
        authorized_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJdummy0000000000000000000000000000000000 testuser@molecule"
  roles:
    - role: users
