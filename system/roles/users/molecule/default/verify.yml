---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check testuser exists
      ansible.builtin.command: id testuser
      changed_when: false

    - name: Check testuser home directory
      ansible.builtin.stat:
        path: /home/testuser
      register: home_dir

    - name: Assert home directory exists
      ansible.builtin.assert:
        that: home_dir.stat.exists
        fail_msg: "testuser home directory does not exist"

    - name: Check .ssh directory
      ansible.builtin.stat:
        path: /home/testuser/.ssh
      register: ssh_dir

    - name: Assert .ssh directory exists with correct permissions
      ansible.builtin.assert:
        that:
          - ssh_dir.stat.exists
          - ssh_dir.stat.mode == '0700'
        fail_msg: ".ssh directory missing or wrong permissions"

    - name: Check authorized_keys
      ansible.builtin.stat:
        path: /home/testuser/.ssh/authorized_keys
      register: auth_keys

    - name: Assert authorized_keys exists
      ansible.builtin.assert:
        that: auth_keys.stat.exists
        fail_msg: "authorized_keys file does not exist"

    - name: Check managed users tracking file
      ansible.builtin.stat:
        path: /etc/ansible-managed-users
      register: managed_users_file

    - name: Assert managed users file exists
      ansible.builtin.assert:
        that: managed_users_file.stat.exists
        fail_msg: "/etc/ansible-managed-users does not exist"
