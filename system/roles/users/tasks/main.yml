- name: Set root password
  when: root_password is defined
  ansible.builtin.user:
    name: root
    password: "{{ root_password }}"
    shell: /bin/bash
    state: present
- name: "Create user `{{ item.name }}`"
  loop: "{{ users }}"
  ansible.builtin.user:
    name: "{{ item.name | mandatory }}"
    password: "{{ item.password | mandatory }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    comment: "{{ item.comment | default('') }}"
    groups: "{{ item.groups | default([]) | join(',') }}"
    home: "{{ item.home | default('/home/' + item.name) }}"
    append: true
    create_home: true
    state: present
- name: Make sure .ssh directory exists for user `{{ item.name }}`
  loop: "{{ users }}"
  ansible.builtin.file:
    path: "{{ item.home | default('/home/' + item.name) }}/.ssh"
    state: directory
    owner: "{{ item.name | mandatory }}"
    group: "{{ item.name | mandatory }}"
    mode: "0700"
- name: "Set authorized keys for user `{{ item.name }}`"
  loop: "{{ users }}"
  when: item.authorized_keys is defined
  ansible.builtin.copy:
    dest: "{{ item.home | default('/home/' + item.name) }}/.ssh/authorized_keys"
    content: "{{ item.authorized_keys | default([]) | join('\n') }}"
    owner: "{{ item.name | mandatory }}"
    group: "{{ item.name | mandatory }}"
    mode: "0600"
- name: Read previously managed users
  ansible.builtin.slurp:
    src: /etc/ansible-managed-users
  register: __managed_users_file
  failed_when: false
- name: Determine users to remove
  ansible.builtin.set_fact:
    __users_to_remove: "{{ (__managed_users_file.content | default('') | b64decode).split('\n') | select | difference(users | map(attribute='name') | list) }}"
- name: "Remove user `{{ item }}` (no longer managed)"
  loop: "{{ __users_to_remove }}"
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: "{{ users_remove_home }}"
- name: Save managed users list
  ansible.builtin.copy:
    dest: /etc/ansible-managed-users
    content: "{{ users | map(attribute='name') | join('\n') }}\n"
    owner: root
    group: root
    mode: "0600"
